# Configuración SOLO para los tests (mvn test).
# Se usa H2 en memoria en modo MySQL: no hace falta tener MySQL encendido.
spring.datasource.url=jdbc:h2:mem:perfumes_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.imagenes.directorio=./target/uploads-test
app.jwt.secret=clave-solo-para-tests-perfumes-store-1234567890
app.jwt.expiracion-minutos=60
app.cors.origenes=http://localhost:5173

# En los tests el pago siempre se aprueba (resultado predecible)
app.pago.probabilidad-exito=1.0

# El catálogo inicial usa sintaxis de MySQL: en los tests no se carga
app.catalogo-inicial.habilitado=false
