
spring.application.name=perfumes

# Configuracion de MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/tienda_perfumes
spring.datasource.username=tienda_app
spring.datasource.password=${DB_PASSWORD}

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Puerto del backend
server.port=8080


spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.imagenes.directorio=./uploads/productos

# Swagger / OpenAPI
# UI:   http://localhost:8080/swagger-ui.html
# JSON: http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.paths-to-match=/api/v1/**
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# JWT (autenticación con tokens)
# La clave debe tener al menos 32 caracteres. En un despliegue real se define
# con la variable de entorno JWT_SECRET y nunca se sube al repositorio.
app.jwt.secret=${JWT_SECRET:clave-de-desarrollo-perfumes-store-cambiar-en-produccion-2026}
app.jwt.expiracion-minutos=120

# Orígenes permitidos para CORS (frontend de Vite)
app.cors.origenes=http://localhost:5173,http://127.0.0.1:5173

# Pago simulado: probabilidad de que un pago sea aprobado (0 a 1)
app.pago.probabilidad-exito=0.7
